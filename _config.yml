title: Sandeep Giri
tagline: Teacher, technologist and founder exploring AI, learning and ideas beyond common sense.
description: >-
  I am the founder of CloudxLab and Terno AI. I write about artificial intelligence,
  learning by inventing, secure enterprise analytics, entrepreneurship and ideas that
  challenge conventional thinking.

url: "https://girisandeep.com"
baseurl: ""

author:
  name: Sandeep Giri
  # email omitted — rendered via JS in contact.html to prevent harvesting
  linkedin: "https://www.linkedin.com/in/girisandeep/"
  github: "https://github.com/girisandeep"
  twitter: "https://x.com/sandeepgiri"

cloudxlab_url: "https://cloudxlab.com/"
terno_url: "https://terno.ai/"
calendly_url: "https://calendly.com/sandeepgiri/30min"

# Giscus comments — fill in repo_id and category_id from https://giscus.app
# Steps: 1) enable Discussions on github.com/girisandeep/blog (Settings → Features)
#        2) visit giscus.app, enter "girisandeep/blog", pick Announcements category, copy the two IDs below
giscus:
  repo_id: ""       # e.g. "R_kgDO..."
  category: "Announcements"
  category_id: ""   # e.g. "DIC_kwDO..."

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 8
paginate_path: "/essays/page:num/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Sandeep Giri"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Feed
feed:
  posts_limit: 20

# SEO
twitter:
  username: "[ADD TWITTER HANDLE]"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - README.md
  - dev_notes.md
