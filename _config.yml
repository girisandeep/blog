title: Sandeep Giri
tagline: Teacher, technologist and founder exploring AI, learning and ideas beyond common sense.
description: >-
  I am the founder of CloudxLab and Terno AI. I write about artificial intelligence,
  learning by inventing, secure enterprise analytics, entrepreneurship and ideas that
  challenge conventional thinking.

url: "https://girisandeep.com"
baseurl: ""

author:
  name: Sandeep Giri
  email: sandeepgiri@gmail.com
  linkedin: "[ADD LINKEDIN URL]"
  github: "[ADD GITHUB URL]"
  twitter: "[ADD TWITTER URL]"

cloudxlab_url: "[ADD CLOUDXLAB URL]"
terno_url: "[ADD TERNO AI URL]"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 8
paginate_path: "/essays/page:num/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Sandeep Giri"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Feed
feed:
  posts_limit: 20

# SEO
twitter:
  username: "[ADD TWITTER HANDLE]"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - README.md
  - dev_notes.md
