---
layout: default
---
<article>
  <header class="page-header">
    <div class="container-content">
      {% if page.label %}
      <div class="page-label">{{ page.label }}</div>
      {% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.description %}
      <p class="page-description">{{ page.description }}</p>
      {% endif %}
    </div>
  </header>

  <div class="section section--sm">
    <div class="container-content">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </div>
</article>
